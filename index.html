<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FatsoMan - Älykäs Dieettikone</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #2c3e50;
            --primary: #3b82f6;
            --protein: #ef4444;
            --carbs: #10b981;
            --fats: #f59e0b;
            --alcohol: #8b5cf6;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        h1, h2, h3 { color: var(--accent); margin-top: 0; }
        
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background: #f8fafc;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: #eff6ff;
            border-radius: 8px;
            border: 1px solid #bfdbfe;
        }

        input[type="checkbox"] { width: 20px; height: 20px; }

        .result-main {
            text-align: center;
            padding: 20px;
            background: var(--accent);
            color: white;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .result-main h1 { color: white; font-size: 2.5rem; margin: 10px 0; }
        .result-main p { margin: 0; opacity: 0.9; }

        .timeframe-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .science-box {
            background: #fdf4ff;
            border: 1px solid #f0abfc;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            color: #86198f;
            text-align: left;
            display: none;
        }

        .science-box h3 { color: #86198f; margin-top: 0; font-size: 1.2rem; margin-bottom: 12px; border-bottom: 1px solid #f0abfc; padding-bottom: 8px;}
        .science-box p { margin: 0 0 10px 0; font-size: 0.95rem; line-height: 1.5; color: #701a75;}
        
        .weekly-impact {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.4;
        }
        
        .impact-ruin { background: #fee2e2; border: 2px solid #ef4444; color: #b91c1c; }
        .impact-zero { background: #fef9c3; border: 2px solid #eab308; color: #a16207; }
        .impact-survive { background: #ffedd5; border: 2px solid #f97316; color: #c2410c; }

        .macro-bars {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .macro-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .m-val { font-size: 1.5rem; font-weight: bold; }
        .p-color { color: var(--protein); }
        .c-color { color: var(--carbs); }
        .f-color { color: var(--fats); }
        .a-color { color: var(--alcohol); }

        .meal-plan { display: flex; flex-direction: column; gap: 15px; }
        .meal-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; }
        
        .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .meal-title { font-weight: bold; font-size: 1.2rem; color: var(--accent); }
